<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Podsilo">
  <!-- The mono mark at 18 units inside a 24-unit canvas (docs/logo.md §3). Android masks a
       notification small icon by alpha and applies its own padding, so a mark drawn to the edges
       loses its top bar. -->
  <g transform="translate(3 3) scale(0.18)">
  <rect x="30" y="6" width="40" height="10" fill="#ffffff"></rect>
  <rect x="36" y="24" width="28" height="10" fill="#ffffff"></rect>
  <path d="M18 42 V94 H82 V42" fill="none" stroke="#ffffff" stroke-width="10"></path>
  <rect x="32" y="70" width="36" height="10" fill="#ffffff"></rect>
  </g>
</svg>
