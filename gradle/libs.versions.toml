# Version catalog. Only entries this Gradle skeleton actually uses are pinned
# here — see CLAUDE.md §3 ("pin versions... no floating +") and §9 (new
# dependencies get proposed, not pre-populated speculatively). Room, Hilt,
# Retrofit, WorkManager, Paging, MockK, Turbine, and MockWebServer get added
# when the module that needs them is actually built.
#
# rssparser (not Stalla — see docs/decisions/0005) and jaudiotagger (the
# Adonai/Kaned1as Android fork via JitPack, not the stale upstream — see
# docs/decisions/0006) are pinned here for :core:feed and :core:download.
#
# okhttp is pinned explicitly at 5.x even though retrofit 3.0.0 declares 4.12.0
# transitively — Gradle resolves to the higher version, and pinning it here
# makes that resolution deliberate and visible rather than accidental.
#
# room + datastore + ksp added for Tier 4a (:core:database, :core:datastore).
# KSP uses the decoupled KSP2 versioning (2.3.x, independent of the Kotlin
# version) — the old "<kotlin>-<ksp>" scheme has no 2.4.10 build. turbine and
# kotlinx-coroutines-test back the Flow/DataStore unit tests.
#
# work + documentfile + hilt (+ androidx.hilt for @HiltWorker) added for Tier 4b
# (the three workers, the SAF write, and the DI graph that constructs them). All
# four are named in CLAUDE.md §3's mandated table, so no dependency ask was
# needed — only the version pin, checked against Maven rather than recalled.
#
# coil + lucide added for Tier 4c (the Compose UI). Unlike everything above,
# neither is in CLAUDE.md §3's mandated table, so both were proposed and
# approved before being added — see docs/decisions/0015. coil-network-okhttp is
# not optional trimming: Coil 3 split networking out of the core artifact, and
# it is the piece that makes Coil reuse the OkHttp already pinned here rather
# than bringing a second HTTP stack, which is the reason it was chosen.
#
# No time/date dependency is pinned, deliberately: java.time is free at
# minSdk 33 and already used across four modules — docs/decisions/0016.
[versions]
agp = "9.3.1"
kotlin = "2.4.10"
room = "2.8.4"
datastore = "1.2.1"
ksp = "2.3.10"
work = "2.11.2"
documentfile = "1.1.0"
hilt = "2.60.1"
androidxHilt = "1.4.0"
turbine = "1.2.1"
composeBom = "2026.06.01"
androidxCoreKtx = "1.17.0"
androidxActivityCompose = "1.11.0"
androidxLifecycleRuntimeKtx = "2.9.4"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
retrofit = "3.0.0"
okhttp = "5.4.0"
junit4 = "4.13.2"
robolectric = "4.15.1"
rssparser = "6.1.8"
jaudiotagger = "2.3.15"
coil = "3.5.0"
