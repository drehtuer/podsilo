#
# Project-wide Gradle settings.
#
# This file did not exist until CI hit `D8: java.lang.OutOfMemoryError: Java heap
# space` on `assembleDebug`. The Gradle skeleton was hand-built rather than
# generated by Android Studio (see docs/journal.md, 2026-07-30), so it never got
# the gradle.properties that every generated Android project ships with — and
# the reason that file exists is exactly this failure.

# Gradle's daemon defaults to a 512 MB heap when org.gradle.jvmargs is unset.
# That is far too small for AGP + Kotlin + Compose: D8 dexes the whole app plus
# its androidx/Compose dependencies, and CI makes it worse by running four
# Gradle invocations (ktlintCheck, detekt, test, assembleDebug) against ONE
# reused daemon, so by the time D8 runs the heap already holds the Kotlin
# compiler, ktlint, detekt and the test infrastructure.
#
# 512 MB is marginal rather than reliably fatal — the same cold sequence passes
# on a 30 GB/16-core dev box and fails on GitHub's 16 GB/4-core runner, which is
# what made this look like a flake. 4 GB removes the margin. GitHub's
# ubuntu-latest has 16 GB, and CLAUDE.md §4 asks WSL2 for 12 GB, so 4 GB here
# plus the Kotlin daemon below fits both comfortably.
#
# MaxMetaspaceSize: Gradle's default is 384m, also tight once the Kotlin
# compiler and two static-analysis tools have loaded their classes.
#
# file.encoding: pinned rather than inherited from the ambient locale. The
# naming/sanitisation tests (CLAUDE.md §6) assert on umlauts, CJK and NFC
# normalisation, so a runner defaulting to a non-UTF-8 charset would break them
# in a way that looks like a logic bug.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# The Kotlin compile daemon is a separate JVM. Left unset it inherits
# org.gradle.jvmargs above, i.e. another 4 GB on top of the Gradle daemon's —
# fine on CI, wasteful on a smaller dev machine. 2 GB is ample for these modules.
kotlin.daemon.jvmargs=-Xmx2g
