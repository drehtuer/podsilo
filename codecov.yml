#
# Codecov configuration. What produces the reports it reads is
# `./gradlew coverage` (build.gradle.kts) and what uploads them is the last
# unit-test step in .github/workflows/ci.yml; this file only says what Codecov
# should do with them.
#
# THE POINT OF THIS FILE IS THAT COVERAGE IS A NUMBER, NOT A GATE. Both status
# checks below are `informational`, so Codecov reports the delta on a pull
# request and never fails it. That is deliberate for the same reason the CI
# workflow refuses to go red on warnings: a check that fails for a reason nobody
# intends to act on is a check that gets ignored, and then the checks that
# matter get ignored with it. The badge in README.adoc is the deliverable here.
#
# There is also no coverage target to hit. This project's testing priorities are
# ranked in CLAUDE.md §7 — sync reconciliation first, feed parsing second, the
# Compose smoke tests last — and a single repository-wide percentage cannot tell
# those apart. It is a trend line, and it is useful as one.

coverage:
  precision: 1
  round: down
  # Drives the badge colour: red at 50 %, green at 90 %, graded between. Chosen
  # to be honest about where this project is rather than flattering — twelve
  # modules including Compose UI will not sit at 90 %, and a badge that is always
  # green says nothing.
  range: "50...90"

  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# JaCoCo reports the module's own classes only, so almost nothing needs excluding
# here. The one real category is Kotlin's inline machinery: a `Flow` operator chain
# compiles to synthetic classes whose debug info points at kotlinx-coroutines'
# own sources (Emitters.kt, SafeCollector.common.kt), which are not files in this
# repository. Codecov drops what it cannot match to the repository tree, so these
# fall out on their own — the entries below are the ones worth stating rather
# than leaving to that behaviour.
ignore:
  - "**/build/**"
  - "**/src/test/**"
  - "**/src/androidTest/**"

comment:
  layout: "condensed_header, condensed_files"
  # Nothing to say on a pull request that changed no covered line.
  require_changes: true
