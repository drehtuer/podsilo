# SPDX-License-Identifier: GPL-3.0-or-later
#
# Tier 1 CI: lint, static analysis, JVM unit tests, and an Android build — all
# without an emulator (see CLAUDE.md §4/§7). Instrumented tests (Tier 2) are
# deliberately not run here; §4 asks for Tier 1 + Tier 3 as the supported path.
#
# DO NOT ADD `connectedAndroidTest` TO THIS WORKFLOW. Everything under
# `src/androidTest/` is the device test set (`./scripts/device-test.sh`,
# docs/dev-environment.md §6), and it exists precisely to check the things a
# hosted runner cannot: ICU regex strictness, the device's SQLite, the installed
# manifest, the cleartext policy, a real Compose runtime. A runner has no device,
# so such a job could only be skipped, fail, or boot an emulator — and an
# emulator agreeing with Robolectric is what let three of this project's worst
# bugs through. The split by source set is the isolation; keep it.
#
# The debug APK (installable as-is: AGP auto-signs it with the debug keystore —
# there is no release signing config, so `assembleRelease` would produce an
# unsigned, uninstallable APK) is uploaded every run as a short-lived workflow
# artifact for manual sideloading. When a GitHub Release is published, the same
# APK is instead attached to that release, where it persists indefinitely —
# release assets aren't subject to the workflow artifact retention window.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Only release-triggered runs actually write anything (attaching the APK to
    # the release); push/pull_request runs never exercise that permission.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Unit tests (Tier 1)
        run: ./gradlew test

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: podsilo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Attach APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" app/build/outputs/apk/debug/app-debug.apk --clobber
