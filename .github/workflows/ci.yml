# SPDX-License-Identifier: GPL-3.0-or-later
#
# Tier 1 CI: lint, static analysis, JVM unit tests, and an Android build — all
# without an emulator (see CLAUDE.md §4/§7). Instrumented tests (Tier 2) are
# deliberately not run here; §4 asks for Tier 1 + Tier 3 as the supported path.
#
# DO NOT ADD `connectedAndroidTest` TO THIS WORKFLOW. Everything under
# `src/androidTest/` is the device test set (`./scripts/device-test.sh`,
# docs/dev-environment.md §6), and it exists precisely to check the things a
# hosted runner cannot: ICU regex strictness, the device's SQLite, the installed
# manifest, the cleartext policy, a real Compose runtime. A runner has no device,
# so such a job could only be skipped, fail, or boot an emulator — and an
# emulator agreeing with Robolectric is what let three of this project's worst
# bugs through. The split by source set is the isolation; keep it.
#
# ARTIFACTS
#
# Both variants are built. `podsilo-<version>-debug.apk` is installable as-is
# (AGP signs it with the debug keystore) and is the sideload build.
# `podsilo-<version>.apk` is the real release: R8-minified and resource-shrunk,
# roughly a twelfth the size, and **signed only when the keystore secrets are
# configured** — see docs/dev-environment.md §9. Without them it still builds,
# but unsigned, and an unsigned APK cannot be installed. That is why the release
# job below refuses to attach one rather than shipping a file that looks like a
# download and isn't.
#
# Every run uploads them as short-lived workflow artifacts. When a GitHub Release
# is published they are attached to it instead, where they persist indefinitely —
# release assets aren't subject to the artifact retention window.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Only release-triggered runs actually write anything (attaching the APK to
    # the release); push/pull_request runs never exercise that permission.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is `git rev-list --count HEAD` (app/build.gradle.kts). The
          # default shallow clone would make every build number 1.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Unit tests (Tier 1)
        run: ./gradlew test

      # The keystore never exists in the repository. It is written from a secret
      # into the runner's workspace for the length of the job, and the workspace
      # is discarded with the runner. `PODSILO_KEYSTORE_BASE64` is the .jks
      # base64-encoded; the other three are its passwords and alias.
      # Emptiness is handled inside the script rather than by a step-level `if`:
      # a step's own `env:` block is not in scope for its `if`, which is a quiet
      # way to end up with a condition that is always false.
      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE: ${{ secrets.PODSILO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
              echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/podsilo-release.jks"
              echo "path=$RUNNER_TEMP/podsilo-release.jks" >> "$GITHUB_OUTPUT"
          else
              echo "No keystore secret configured — the release APK will be unsigned."
          fi

      - name: Assemble debug and release APKs
        env:
          PODSILO_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          PODSILO_KEYSTORE_PASSWORD: ${{ secrets.PODSILO_KEYSTORE_PASSWORD }}
          PODSILO_KEY_ALIAS: ${{ secrets.PODSILO_KEY_ALIAS }}
          PODSILO_KEY_PASSWORD: ${{ secrets.PODSILO_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: podsilo-apks
          path: |
            app/build/outputs/apk/debug/podsilo-*.apk
            app/build/outputs/apk/release/podsilo-*.apk
          retention-days: 7

      # An unsigned release APK is not attached: it downloads like a real build
      # and then refuses to install, which is worse than its absence. The debug
      # APK always goes up, so a release is never left with nothing installable.
      - name: Attach APKs to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" app/build/outputs/apk/debug/podsilo-*-debug.apk --clobber
          release_apk="$(ls app/build/outputs/apk/release/podsilo-*.apk 2>/dev/null | head -1)"
          if [ -n "$release_apk" ] && unzip -l "$release_apk" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)'; then
              gh release upload "$TAG" "$release_apk" --clobber
          else
              echo "::warning::Release APK is unsigned — not attached. Configure the keystore secrets (docs/dev-environment.md §9)."
          fi
