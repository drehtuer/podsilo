#
# SonarQube Cloud configuration, read by the sonar-scanner that CI runs after
# `./gradlew coverage` (.github/workflows/ci.yml). This replaced Codecov on
# 2026-09-12; `decisions/0028` records what changed and what deliberately did
# not.
#
# It has to be the scanner rather than SonarQube's automatic analysis for one
# decisive reason: automatic analysis cannot ingest a coverage report at all,
# and coverage is the entire point of having this here.
#
# AUTOMATIC ANALYSIS IS SWITCHED OFF ON THE SONARCLOUD PROJECT, and the CI scan
# depends on it: the two are mutually exclusive, and with autoscan on, SonarQube
# rejects a scanner analysis outright rather than merging it. That setting lives
# in the project's web UI, not in this repository, so it is the one part of this
# configuration a clean checkout cannot reproduce — hence writing it down here.
# To check it without opening the UI:
#
#   curl -s 'https://sonarcloud.io/api/settings/values\
#     ?component=drehtuer_podsiloApp&keys=sonar.autoscan.enabled'
#
# It must report `"value":"false"`. Note the instance default is `true`, which
# is why this reads as an override (`"parentValue":"true"`) rather than as the
# absence of a setting.
#
# SONAR_TOKEN comes from the repository's GitHub secrets and is never written
# here. The key and organization below match the SonarCloud project, which is
# public — that is what lets the README badges read the measures anonymously.

sonar.projectKey=drehtuer_podsiloApp
sonar.organization=drehtuer
sonar.host.url=https://sonarcloud.io
sonar.projectName=Podsilo

sonar.sourceEncoding=UTF-8

# One scan over the whole repository rather than a module list, so a thirteenth
# module is analysed the moment it exists — the same reason CI discovers the
# JaCoCo reports with `find` instead of a written-down list.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/src/androidTest/**

sonar.java.source=17
sonar.java.binaries=**/build/classes,**/build/tmp/kotlin-classes
sonar.kotlin.threads=4

# Coverage. `./gradlew coverage` writes one report per module by two different
# routes — Gradle's `jacoco` plugin for the four pure-JVM modules, AGP's
# `createDebugUnitTestCoverageReport` for the eight Android ones — and Sonar
# merges the list itself. Both globs are needed; neither path covers both kinds
# of module. `decisions/0028` explains why there are two.
sonar.coverage.jacoco.xmlReportPaths=\
  **/build/reports/jacoco/test/jacocoTestReport.xml,\
  **/build/reports/coverage/test/debug/report.xml
sonar.junit.reportPaths=\
  **/build/test-results/test,\
  **/build/test-results/testDebugUnitTest

# Not product code, or not analysable here.
#
# assets/ is design source: SVG art, the icon set, and `icons.js`, which is
# vendored Lucide (ISC, see third-party.adoc) kept verbatim so it stays
# comparable with upstream. docs/ is AsciiDoc, already checked by asciidoctor
# --failure-level=WARN in the same workflow, and supplemental-ui/ is a one-file
# override of Antora's stock UI bundle.
#
# The test directories are named again here because `sonar.sources=.` and
# `sonar.tests=.` cover the same tree; without this the scanner refuses to index
# a test file twice.
sonar.exclusions=\
  **/build/**,\
  **/.gradle/**,\
  assets/**,\
  docs/**,\
  supplemental-ui/**,\
  **/src/test/**,\
  **/src/androidTest/**

# THERE ARE DELIBERATELY NO `sonar.coverage.exclusions` HERE. Codecov measured
# every main source file in the twelve modules and reported 77.2 %; excluding
# anything now would move the number for a reason that has nothing to do with
# the tests, and the number is only useful as a trend line (`decisions/0028`).
# If something genuinely cannot be unit-tested, exclude it *and* say so in that
# ADR, so the step in the graph has an explanation attached.
